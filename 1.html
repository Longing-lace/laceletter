<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CSS Mgr">
    <link rel="apple-touch-icon" href="https://iili.io/B4t9G6P.md.png">
    
    <title>极简 CSS 管理</title>
    <style>
        @import url("https://fontsapi.zeoseven.com/285/main/result.css");
        @import url("https://fontsapi.zeoseven.com/327/main/result.css");

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border: none;
            outline: none;
            color: #000;
        }

        body, button, input, textarea, select, .snippet-content {
            font-family: "Abyssinica SIL", "Noto Serif CJK", sans-serif;
            font-weight: normal;
        }

        body {
            background-color: #fff;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        button {
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        input, textarea, select {
            background-color: #f5f5f5;
            padding: 12px;
            border-radius: 4px;
            width: 100%;
            font-size: 14px;
            -webkit-appearance: none;
        }

        textarea {
            resize: none;
            min-height: 150px;
        }

        #editCode {
            flex: 1;
            min-height: 250px;
            resize: none;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 20px;
        }

        .actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search-bar {
            flex-grow: 1;
            max-width: 400px;
            display: flex;
            align-items: center;
            background: #f5f5f5;
            border-radius: 4px;
            padding: 0 10px;
        }

        .search-bar input {
            background: transparent;
            padding-left: 5px;
            flex-grow: 1;
        }

        .tags-container {
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .tag {
            background-color: #f0f0f0;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            border-radius: 4px;
            transition: background-color 0.15s;
        }

        .tag.active {
            background-color: #000;
            color: #fff;
        }

        .tag.active svg {
            fill: #fff;
        }

        .snippets {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 90px;
        }

        .snippet-card {
            background-color: #fcfcfc;
            padding: 20px;
            border-radius: 8px;
        }

        .snippet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .snippet-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chevron {
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        .chevron.open {
            transform: rotate(90deg);
        }

        .snippet-title {
            font-size: 18px;
            font-weight: bold;
            user-select: none;
        }

        .snippet-meta {
            font-size: 11px;
            color: #bbb;
            margin-top: 3px;
        }

        .snippet-actions {
            display: flex;
            gap: 10px;
        }

        .snippet-body {
            display: none;
            margin-top: 15px;
        }

        .snippet-body.open {
            display: block;
        }

        /* In-card search bar */
        .card-search-bar {
            display: none;
            align-items: center;
            background: #f0f0f0;
            border-radius: 4px;
            padding: 6px 10px;
            margin-bottom: 10px;
            gap: 8px;
        }

        .card-search-bar.visible {
            display: flex;
        }

        .card-search-bar input {
            background: transparent;
            padding: 2px 0;
            font-size: 13px;
            border-radius: 0;
            flex: 1;
        }

        .card-search-bar .match-count {
            font-size: 12px;
            color: #999;
            white-space: nowrap;
        }

        .snippet-content-wrapper {
            position: relative;
        }

        .snippet-content {
            background-color: #f5f5f5;
            padding: 15px;
            padding-top: 44px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 14px;
            line-height: 1.6;
            max-height: 80vh;
            overflow-y: auto;
        }

        .snippet-content::-webkit-scrollbar,
        #editCode::-webkit-scrollbar {
            width: 6px;
        }
        .snippet-content::-webkit-scrollbar-thumb,
        #editCode::-webkit-scrollbar-thumb {
            background-color: #ccc;
            border-radius: 3px;
        }
        .snippet-content::-webkit-scrollbar-track,
        #editCode::-webkit-scrollbar-track {
            background: transparent;
        }

        .code-comment {
            color: #999;
            font-style: italic;
        }

        mark.code-highlight {
            background-color: #ffe066;
            color: inherit;
            border-radius: 2px;
        }

        /* Toolbar: scroll-top, scroll-bottom, search, copy */
        .content-toolbar {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .content-toolbar button {
            background: #fff;
            padding: 5px;
            border-radius: 4px;
        }

        .content-toolbar button:active {
            background: #e8e8e8;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 600px;
            background: #fff;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 0 0 auto;
        }

        .form-group:has(#editCode) {
            flex: 1 1 auto;
            min-height: 0;
        }

        .form-group label {
            font-size: 14px;
            font-weight: bold;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag-toggle {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }

        .tag-checkbox {
            display: none;
        }

        .tag-text {
            background-color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            white-space: nowrap;
            transition: background-color 0.2s;
        }

        .tag-checkbox:checked + .tag-text {
            background-color: #f0f0f0;
        }

        #fileInput {
            display: none;
        }

        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 28px;
            right: 24px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 500;
            box-shadow: 0 2px 14px rgba(0, 0, 0, 0.18);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .fab:active {
            transform: scale(0.92);
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.12);
        }

        .fab svg {
            fill: #fff;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: stretch;
            }
            .actions {
                justify-content: space-between;
            }
            .search-bar {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h2>CSS Mgr</h2>
        <div class="search-bar">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18.031 16.6168L22.3137 20.8995L20.8995 22.3137L16.6168 18.031C15.0769 19.263 13.124 20 11 20C6.032 20 2 15.968 2 11C2 6.032 6.032 2 11 2C15.968 2 20 6.032 20 11C20 13.124 19.263 15.0769 18.031 16.6168ZM16.0247 15.8748C17.2475 14.6146 18 12.8956 18 11C18 7.1325 14.8675 4 11 4C7.1325 4 4 7.1325 4 11C4 14.8675 7.1325 18 11 18C12.8956 18 14.6146 17.2475 15.8748 16.0247L16.0247 15.8748Z"></path></svg>
            <input type="text" id="searchInput" placeholder="搜索 CSS 名称...">
        </div>
        <div class="actions">
            <button onclick="openModal('tagModal')" title="管理标签">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2 13.364L10.636 22H22V10.636L13.364 2H2v11.364zm2-1.414V4h7.55l8.45 8.45v7.55l-8.45-8.45L4 11.95zm5-4.45a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"></path></svg>
            </button>
            <button onclick="openAddModal()" title="添加 CSS">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2h6z"></path></svg>
            </button>
            <button onclick="exportData()" title="导出数据">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 19h18v2H3v-2zm10-10.999L19.071 14l1.414-1.414L12 4l-8.485 8.485L4.929 14 11 8.001V17h2V8.001z"></path></svg>
            </button>
            <button onclick="document.getElementById('fileInput').click()" title="导入数据">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 19h18v2H3v-2zm10-5.828L19.071 7.1l1.414 1.414L12 17 3.515 8.515 4.929 7.1 11 13.172V2h2v11.172z"></path></svg>
                <input type="file" id="fileInput" accept=".json" onchange="importData(event)">
            </button>
        </div>
    </header>

    <div class="tags-container" id="tagsFilterContainer"></div>
    <div class="snippets" id="snippetsContainer"></div>

    <!-- Floating Action Button -->
    <button class="fab" onclick="openAddModal()" title="添加 CSS">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2h6z"></path></svg>
    </button>

    <!-- Edit / Add Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">添加 CSS</span>
                <button onclick="closeModal('editModal')">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 10.586l4.95-4.95 1.414 1.414-4.95 4.95 4.95 4.95-1.414 1.414-4.95-4.95-4.95 4.95-1.414-1.414 4.95-4.95-4.95-4.95L7.05 5.636z"></path></svg>
                </button>
            </div>
            <input type="hidden" id="editId">
            <div class="form-group">
                <label>CSS 名称</label>
                <input type="text" id="editName" placeholder="例如：居中布局">
            </div>
            <div class="form-group">
                <label>代码内容</label>
                <textarea id="editCode" placeholder="输入 CSS 代码..."></textarea>
            </div>
            <div class="form-group">
                <label>分配标签</label>
                <div class="checkbox-group" id="editTagsGroup"></div>
            </div>
            <div style="display: flex; justify-content: flex-end; padding-top: 10px;">
                <button onclick="saveSnippet()" title="保存修改">
                    <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M10 15.172l9.192-9.193 1.415 1.414L10 18l-6.364-6.364 1.414-1.414z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Tag Manager Modal -->
    <div class="modal" id="tagModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>管理标签</span>
                <button onclick="closeModal('tagModal')">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 10.586l4.95-4.95 1.414 1.414-4.95 4.95 4.95 4.95-1.414 1.414-4.95-4.95-4.95 4.95-1.414-1.414 4.95-4.95-4.95-4.95L7.05 5.636z"></path></svg>
                </button>
            </div>
            <div class="form-group">
                <label>新增标签</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="text" id="newTagName" placeholder="输入新标签名">
                    <button onclick="addTag()" title="添加">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2h6z"></path></svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label>现有标签 (点击删除)</label>
                <div class="tags-container" id="manageTagsContainer" style="margin-bottom: 0;"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bgimdvzikaoauuvgsehn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJnaW1kdnppa2FvYXV1dmdzZWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMzA0OTcsImV4cCI6MjA5MjYwNjQ5N30.ee_yctmUGZso5oVqoCdXCFcsC7baWzO-HP6-AP0xOF0';

        const API_HEADERS = {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json'
        };

        let state = { tags: [], snippets: [], activeTags: [], searchQuery: '' };

        // ── Supabase via fetch (no SDK, no WebSocket) ──────────────────────
        async function loadData() {
            try {
                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/app_data?id=eq.css_mgr&select=data`,
                    { headers: API_HEADERS }
                );
                const rows = await res.json();
                if (rows && rows[0] && rows[0].data) {
                    const d = rows[0].data;
                    state.tags = d.tags || [];
                    state.snippets = d.snippets || [];
                }
            } catch (e) {
                console.error('loadData failed', e);
            }
            renderAll();
        }

        async function saveData() {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/app_data`, {
                    method: 'POST',
                    headers: { ...API_HEADERS, 'Prefer': 'resolution=merge-duplicates' },
                    body: JSON.stringify({
                        id: 'css_mgr',
                        data: { tags: state.tags, snippets: state.snippets }
                    })
                });
            } catch (e) {
                console.error('saveData failed', e);
            }
            renderAll();
        }

        // ── Render ─────────────────────────────────────────────────────────
        function renderAll() {
            renderFilterTags();
            renderSnippets();
            renderManageTags();
            renderEditTags();
        }

        function renderFilterTags() {
            const container = document.getElementById('tagsFilterContainer');
            const allActive = state.activeTags.length === 0;
            container.innerHTML = `<div class="tag ${allActive ? 'active' : ''}" onclick="filterByTag(null)">全部</div>`;
            state.tags.forEach(tag => {
                const isActive = state.activeTags.includes(tag);
                container.innerHTML += `<div class="tag ${isActive ? 'active' : ''}" onclick="filterByTag('${escAttr(tag)}')">${escapeHTML(tag)}</div>`;
            });
        }

        function filterByTag(tag) {
            if (tag === null) {
                state.activeTags = [];
            } else {
                const idx = state.activeTags.indexOf(tag);
                if (idx > -1) state.activeTags.splice(idx, 1);
                else state.activeTags.push(tag);
            }
            renderSnippets();
            renderFilterTags();
        }

        function toggleSnippet(id) {
            const body = document.getElementById(`body-${id}`);
            const chevron = document.getElementById(`chevron-${id}`);
            if (!body) return;
            const isOpen = body.classList.contains('open');
            body.classList.toggle('open', !isOpen);
            chevron.classList.toggle('open', !isOpen);
        }

        function highlightComments(code) {
            return escapeHTML(code).replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="code-comment">$1</span>');
        }

        function formatDate(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
        }

        function renderSnippets() {
            const container = document.getElementById('snippetsContainer');
            container.innerHTML = '';
            let filtered = state.snippets;

            if (state.searchQuery) {
                const q = state.searchQuery.toLowerCase();
                filtered = filtered.filter(s => s.name.toLowerCase().includes(q));
            }
            if (state.activeTags.length > 0) {
                filtered = filtered.filter(s => s.tags && state.activeTags.every(t => s.tags.includes(t)));
            }

            filtered.forEach(snippet => {
                const sid = snippet.id;
                const snippetTags = snippet.tags
                    ? snippet.tags.map(t => `<span class="tag">${escapeHTML(t)}</span>`).join('')
                    : '';
                const updatedAt = formatDate(snippet.updatedAt);

                container.innerHTML += `
                    <div class="snippet-card">
                        <div class="snippet-header" onclick="toggleSnippet('${sid}')">
                            <div class="snippet-title-group">
                                <svg id="chevron-${sid}" class="chevron" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                    <path d="M13.1716 12.0007L8.22192 7.05093L9.63614 5.63672L16.0001 12.0007L9.63614 18.3646L8.22192 16.9504L13.1716 12.0007Z"/>
                                </svg>
                                <div>
                                    <div class="snippet-title">${escapeHTML(snippet.name)}</div>
                                    ${updatedAt ? `<div class="snippet-meta">修改于 ${updatedAt}</div>` : ''}
                                </div>
                            </div>
                            <div class="snippet-actions" onclick="event.stopPropagation()">
                                <button onclick="openEditModal('${sid}')" title="编辑">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16.757 3l-2 2H5v14h14V9.243l2-2V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h12.757zm3.728-.9l1.414 1.414-9.9 9.9-1.414-1.414 9.9-9.9z"/></svg>
                                </button>
                                <button onclick="deleteSnippet('${sid}')" title="删除">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M17 6h5v2h-2v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8H2V6h5V3a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v3zm1 2H6v12h12V8zm-9 3h2v6H9v-6zm4 0h2v6h-2v-6zM9 4v2h6V4H9z"/></svg>
                                </button>
                            </div>
                        </div>
                        <div class="snippet-body" id="body-${sid}">
                            <div class="tags-container" style="margin-bottom: 15px;">${snippetTags}</div>
                            <div class="card-search-bar" id="csbar-${sid}">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="#999"><path d="M18.031 16.617L22.314 20.9l-1.414 1.414-4.284-4.284A9 9 0 1 1 20 11c0 2.124-.763 4.063-2.031 5.569l.062.048zM11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z"/></svg>
                                <input type="text" id="csinput-${sid}" placeholder="在此条目内搜索..." oninput="searchInCard('${sid}', this.value)">
                                <span class="match-count" id="csmatch-${sid}"></span>
                                <button onclick="closeCardSearch('${sid}')">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 10.586l4.95-4.95 1.414 1.414-4.95 4.95 4.95 4.95-1.414 1.414-4.95-4.95-4.95 4.95-1.414-1.414 4.95-4.95-4.95-4.95L7.05 5.636z"/></svg>
                                </button>
                            </div>
                            <div class="snippet-content-wrapper">
                                <div class="content-toolbar">
                                    <button onclick="scrollContent('${sid}','top')" title="回顶部">
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 10.828l-4.95 4.95-1.414-1.414L12 8l6.364 6.364-1.414 1.414z"/></svg>
                                    </button>
                                    <button onclick="scrollContent('${sid}','bottom')" title="跳底部">
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 13.172l4.95-4.95 1.414 1.414L12 16 5.636 9.636 7.05 8.222z"/></svg>
                                    </button>
                                    <button onclick="toggleCardSearch('${sid}')" title="条目内搜索">
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M18.031 16.617L22.314 20.9l-1.414 1.414-4.284-4.284A9 9 0 1 1 20 11c0 2.124-.763 4.063-2.031 5.569l.062.048zM11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z"/></svg>
                                    </button>
                                    <button onclick="copyCode(this,'${sid}')" title="一键复制">
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M7 4V2h14v14h-2V4H7zM3 6h14v14H3V6zm2 2v10h10V8H5z"/></svg>
                                    </button>
                                </div>
                                <div class="snippet-content" id="content-${sid}">${highlightComments(snippet.code)}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // ── In-card scroll ─────────────────────────────────────────────────
        function scrollContent(id, dir) {
            const el = document.getElementById(`content-${id}`);
            if (!el) return;
            el.scrollTo({ top: dir === 'top' ? 0 : el.scrollHeight, behavior: 'smooth' });
        }

        // ── In-card search ─────────────────────────────────────────────────
        function toggleCardSearch(id) {
            const bar = document.getElementById(`csbar-${id}`);
            if (!bar) return;
            const willShow = !bar.classList.contains('visible');
            bar.classList.toggle('visible', willShow);
            if (willShow) {
                document.getElementById(`csinput-${id}`).focus();
            } else {
                closeCardSearch(id);
            }
        }

        function closeCardSearch(id) {
            const bar = document.getElementById(`csbar-${id}`);
            if (bar) bar.classList.remove('visible');
            const inp = document.getElementById(`csinput-${id}`);
            if (inp) inp.value = '';
            searchInCard(id, '');
        }

        function searchInCard(id, query) {
            const el = document.getElementById(`content-${id}`);
            const matchEl = document.getElementById(`csmatch-${id}`);
            const snippet = state.snippets.find(s => s.id === id);
            if (!el || !snippet) return;

            const base = highlightComments(snippet.code);

            if (!query.trim()) {
                el.innerHTML = base;
                if (matchEl) matchEl.textContent = '';
                return;
            }

            const safe = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${safe})(?![^<]*>)`, 'gi');
            let count = 0;
            const highlighted = base.replace(regex, m => { count++; return `<mark class="code-highlight">${m}</mark>`; });
            el.innerHTML = highlighted;
            if (matchEl) matchEl.textContent = count > 0 ? `${count} 处` : '无匹配';
            const first = el.querySelector('mark.code-highlight');
            if (first) first.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        // ── Tags ───────────────────────────────────────────────────────────
        function renderManageTags() {
            const container = document.getElementById('manageTagsContainer');
            container.innerHTML = '';
            state.tags.forEach(tag => {
                container.innerHTML += `
                    <div class="tag" onclick="deleteTag('${escAttr(tag)}')" title="点击删除">
                        ${escapeHTML(tag)}
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 10.586l4.95-4.95 1.414 1.414-4.95 4.95 4.95 4.95-1.414 1.414-4.95-4.95-4.95 4.95-1.414-1.414 4.95-4.95-4.95-4.95L7.05 5.636z"/></svg>
                    </div>
                `;
            });
        }

        function renderEditTags() {
            const container = document.getElementById('editTagsGroup');
            container.innerHTML = '';
            state.tags.forEach(tag => {
                container.innerHTML += `
                    <label class="tag-toggle">
                        <input type="checkbox" value="${escAttr(tag)}" class="tag-checkbox">
                        <span class="tag-text">${escapeHTML(tag)}</span>
                    </label>
                `;
            });
        }

        // ── Modal helpers ──────────────────────────────────────────────────
        function openModal(id) { document.getElementById(id).classList.add('active'); }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            if (id === 'editModal') {
                document.getElementById('editId').value = '';
                document.getElementById('editName').value = '';
                document.getElementById('editCode').value = '';
                document.getElementById('modalTitle').innerText = '添加 CSS';
                document.querySelectorAll('.tag-checkbox').forEach(cb => cb.checked = false);
            }
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = '添加 CSS';
            openModal('editModal');
        }

        function openEditModal(id) {
            document.getElementById('modalTitle').innerText = '编辑 CSS';
            const snippet = state.snippets.find(s => s.id === id);
            if (snippet) {
                document.getElementById('editId').value = snippet.id;
                document.getElementById('editName').value = snippet.name;
                document.getElementById('editCode').value = snippet.code;
                document.querySelectorAll('.tag-checkbox').forEach(cb => {
                    cb.checked = snippet.tags && snippet.tags.includes(cb.value);
                });
            }
            openModal('editModal');
        }

        // ── CRUD ───────────────────────────────────────────────────────────
        function saveSnippet() {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('editName').value.trim();
            const code = document.getElementById('editCode').value.trim();
            if (!name || !code) return alert('名称和代码不能为空');
            const selectedTags = Array.from(document.querySelectorAll('.tag-checkbox:checked')).map(cb => cb.value);
            const now = Date.now();
            if (id) {
                const idx = state.snippets.findIndex(s => s.id === id);
                if (idx > -1) state.snippets[idx] = { id, name, code, tags: selectedTags, updatedAt: now };
            } else {
                state.snippets.unshift({ id: now.toString(), name, code, tags: selectedTags, updatedAt: now });
            }
            saveData();
            closeModal('editModal');
        }

        function deleteSnippet(id) {
            if (confirm('确定要删除此 CSS 吗？')) {
                state.snippets = state.snippets.filter(s => s.id !== id);
                saveData();
            }
        }

        function addTag() {
            const input = document.getElementById('newTagName');
            const val = input.value.trim();
            if (val && !state.tags.includes(val)) {
                state.tags.push(val);
                saveData();
                input.value = '';
            }
        }

        function deleteTag(tag) {
            if (confirm(`确定删除标签 "${tag}" 吗？这会从所有关联的 CSS 中移除该标签。`)) {
                state.tags = state.tags.filter(t => t !== tag);
                state.snippets.forEach(s => { if (s.tags) s.tags = s.tags.filter(t => t !== tag); });
                state.activeTags = state.activeTags.filter(t => t !== tag);
                saveData();
            }
        }

        // ── Copy ───────────────────────────────────────────────────────────
        function copyCode(btn, id) {
            const snippet = state.snippets.find(s => s.id === id);
            if (!snippet) return;
            const showSuccess = () => {
                const orig = btn.innerHTML;
                btn.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M10 15.172l9.192-9.193 1.415 1.414L10 18l-6.364-6.364 1.414-1.414z"/></svg>`;
                setTimeout(() => btn.innerHTML = orig, 1500);
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(snippet.code).then(showSuccess).catch(() => fallbackCopy(snippet.code, showSuccess));
            } else {
                fallbackCopy(snippet.code, showSuccess);
            }
        }

        function fallbackCopy(text, cb) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;top:0;left:0;width:2em;height:2em;padding:0;border:none;outline:none;box-shadow:none;background:transparent;';
            document.body.appendChild(ta);
            ta.focus(); ta.select();
            try { if (document.execCommand('copy')) cb(); else alert('复制失败，请手动长按全选复制'); }
            catch { alert('设备不支持一键复制，请长按全选复制'); }
            document.body.removeChild(ta);
        }

        // ── Export / Import ────────────────────────────────────────────────
        function exportData() {
            const blob = new Blob([JSON.stringify({ tags: state.tags, snippets: state.snippets }, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `css-mgr-backup-${Date.now()}.json`; a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.snippets && Array.isArray(parsed.snippets)) {
                        state.tags = parsed.tags || [];
                        state.snippets = parsed.snippets;
                        saveData();
                        alert('数据导入成功！');
                    } else alert('文件格式错误！');
                } catch { alert('文件解析失败！'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ── Utils ──────────────────────────────────────────────────────────
        document.getElementById('searchInput').addEventListener('input', e => {
            state.searchQuery = e.target.value;
            renderSnippets();
        });

        function escapeHTML(str) {
            return String(str).replace(/[&<>'"]/g,
                t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t])
            );
        }

        function escAttr(str) {
            return String(str).replace(/'/g, "\\'");
        }

        loadData();
    </script>
</body>
</html>
