<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CSS Mgr">
    <link rel="apple-touch-icon" href="https://iili.io/B4t9G6P.md.png">
    
    <title>极简 CSS 管理</title>
    <style>
        /* 确保 @import 在 CSS 的最顶端 */
        @import url("https://fontsapi.zeoseven.com/285/main/result.css");
        @import url("https://fontsapi.zeoseven.com/327/main/result.css");

        /* 全局基础重置与黑白灰配色 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border: none;
            outline: none;
            color: #000;
        }

        /* 显式指定所有包含文字的元素应用该字体 */
        body, button, input, textarea, select, .snippet-content {
            font-family: "Abyssinica SIL", "Noto Serif CJK", sans-serif;
            font-weight: normal;
        }

        body {
            background-color: #fff;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        button {
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        input, textarea, select {
            background-color: #f5f5f5;
            padding: 12px;
            border-radius: 4px;
            width: 100%;
            font-size: 14px;
            -webkit-appearance: none;
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 20px;
        }

        .actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search-bar {
            flex-grow: 1;
            max-width: 400px;
            display: flex;
            align-items: center;
            background: #f5f5f5;
            border-radius: 4px;
            padding: 0 10px;
        }

        .search-bar input {
            background: transparent;
            padding-left: 5px;
            flex-grow: 1;
        }

        .tags-container {
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .tag {
            background-color: #f0f0f0;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            border-radius: 4px;
        }

        .tag.active {
            background-color: #000;
            color: #fff;
        }
        
        .tag.active svg {
            fill: #fff;
        }

        .snippets {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .snippet-card {
            background-color: #fcfcfc;
            padding: 20px;
            border-radius: 8px;
        }

        .snippet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .snippet-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chevron {
            transition: transform 0.2s ease;
        }

        .chevron.open {
            transform: rotate(90deg);
        }

        .snippet-title {
            font-size: 18px;
            font-weight: bold;
            user-select: none;
        }

        .snippet-actions {
            display: flex;
            gap: 10px;
        }

        .snippet-body {
            display: none;
            margin-top: 15px;
        }

        .snippet-body.open {
            display: block;
        }

        .snippet-content-wrapper {
            position: relative;
        }

        .snippet-content {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 14px;
            line-height: 1.6;
        }

        /* 优化后的注释样式：更浅的灰色 + 斜体 */
        .code-comment {
            color: #999; 
            font-style: italic;
        }

        .btn-copy {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #fff;
            padding: 5px;
            border-radius: 4px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 600px;
            background: #fff;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: bold;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag-toggle {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }

        .tag-checkbox {
            display: none;
        }

        .tag-text {
            background-color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            white-space: nowrap;
            transition: background-color 0.2s;
        }

        .tag-checkbox:checked + .tag-text {
            background-color: #f0f0f0;
        }

        #fileInput {
            display: none;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: stretch;
            }
            .actions {
                justify-content: space-between;
            }
            .search-bar {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h2>CSS Mgr</h2>
        <div class="search-bar">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18.031 16.6168L22.3137 20.8995L20.8995 22.3137L16.6168 18.031C15.0769 19.263 13.124 20 11 20C6.032 20 2 15.968 2 11C2 6.032 6.032 2 11 2C15.968 2 20 6.032 20 11C20 13.124 19.263 15.0769 18.031 16.6168ZM16.0247 15.8748C17.2475 14.6146 18 12.8956 18 11C18 7.1325 14.8675 4 11 4C7.1325 4 4 7.1325 4 11C4 14.8675 7.1325 18 11 18C12.8956 18 14.6146 17.2475 15.8748 16.0247L16.0247 15.8748Z"></path></svg>
            <input type="text" id="searchInput" placeholder="搜索 CSS 名称...">
        </div>
        <div class="actions">
            <button onclick="openModal('tagModal')" title="管理标签">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2 13.364L10.636 22H22V10.636L13.364 2H2v11.364zm2-1.414V4h7.55l8.45 8.45v7.55l-8.45-8.45L4 11.95zm5-4.45a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"></path></svg>
            </button>
            <button onclick="openModal('editModal')" title="添加 CSS">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2h6z"></path></svg>
            </button>
            <button onclick="exportData()" title="导出数据">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 19h18v2H3v-2zm10-10.999L19.071 14l1.414-1.414L12 4l-8.485 8.485L4.929 14 11 8.001V17h2V8.001z"></path></svg>
            </button>
            <button onclick="document.getElementById('fileInput').click()" title="导入数据">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 19h18v2H3v-2zm10-5.828L19.071 7.1l1.414 1.414L12 17 3.515 8.515 4.929 7.1 11 13.172V2h2v11.172z"></path></svg>
                <input type="file" id="fileInput" accept=".json" onchange="importData(event)">
            </button>
        </div>
    </header>

    <div class="tags-container" id="tagsFilterContainer"></div>

    <div class="snippets" id="snippetsContainer"></div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">添加 CSS</span>
                <button onclick="closeModal('editModal')">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 10.586l4.95-4.95 1.414 1.414-4.95 4.95 4.95 4.95-1.414 1.414-4.95-4.95-4.95 4.95-1.414-1.414 4.95-4.95-4.95-4.95L7.05 5.636z"></path></svg>
                </button>
            </div>
            <input type="hidden" id="editId">
            <div class="form-group">
                <label>CSS 名称</label>
                <input type="text" id="editName" placeholder="例如：居中布局">
            </div>
            <div class="form-group">
                <label>代码内容</label>
                <textarea id="editCode" placeholder="输入 CSS 代码..."></textarea>
            </div>
            <div class="form-group">
                <label>分配标签</label>
                <div class="checkbox-group" id="editTagsGroup"></div>
            </div>
            <div style="display: flex; justify-content: flex-end; padding-top: 10px;">
                <button onclick="saveSnippet()" title="保存修改">
                    <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M10 15.172l9.192-9.193 1.415 1.414L10 18l-6.364-6.364 1.414-1.414z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <div class="modal" id="tagModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>管理标签</span>
                <button onclick="closeModal('tagModal')">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 10.586l4.95-4.95 1.414 1.414-4.95 4.95 4.95 4.95-1.414 1.414-4.95-4.95-4.95 4.95-1.414-1.414 4.95-4.95-4.95-4.95L7.05 5.636z"></path></svg>
                </button>
            </div>
            <div class="form-group">
                <label>新增标签</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="text" id="newTagName" placeholder="输入新标签名">
                    <button onclick="addTag()" title="添加">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2h6z"></path></svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label>现有标签 (点击删除)</label>
                <div class="tags-container" id="manageTagsContainer" style="margin-bottom: 0;"></div>
            </div>
        </div>
    </div>

    <script>
        let state = { tags: [], snippets: [], activeTag: null, searchQuery: '' };

        function loadData() {
            const saved = localStorage.getItem('cssMgrData');
            if (saved) {
                state = { ...state, ...JSON.parse(saved) };
                if(!state.tags) state.tags = [];
                if(!state.snippets) state.snippets = [];
            }
            renderAll();
        }

        function saveData() {
            localStorage.setItem('cssMgrData', JSON.stringify({ tags: state.tags, snippets: state.snippets }));
            renderAll();
        }

        function renderAll() {
            renderFilterTags();
            renderSnippets();
            renderManageTags();
            renderEditTags();
        }

        function renderFilterTags() {
            const container = document.getElementById('tagsFilterContainer');
            container.innerHTML = `<div class="tag ${state.activeTag === null ? 'active' : ''}" onclick="filterByTag(null)">全部</div>`;
            state.tags.forEach(tag => {
                container.innerHTML += `<div class="tag ${state.activeTag === tag ? 'active' : ''}" onclick="filterByTag('${tag}')">${tag}</div>`;
            });
        }

        function toggleSnippet(id) {
            const body = document.getElementById(`body-${id}`);
            const chevron = document.getElementById(`chevron-${id}`);
            if (body.classList.contains('open')) {
                body.classList.remove('open');
                chevron.classList.remove('open');
            } else {
                body.classList.add('open');
                chevron.classList.add('open');
            }
        }

        function highlightCommentsAndHTML(code) {
            let escaped = escapeHTML(code);
            return escaped.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="code-comment">$1</span>');
        }

        function renderSnippets() {
            const container = document.getElementById('snippetsContainer');
            container.innerHTML = '';
            let filtered = state.snippets;

            if (state.searchQuery) {
                const q = state.searchQuery.toLowerCase();
                filtered = filtered.filter(s => s.name.toLowerCase().includes(q));
            }
            if (state.activeTag) {
                filtered = filtered.filter(s => s.tags && s.tags.includes(state.activeTag));
            }

            filtered.forEach(snippet => {
                const snippetTags = snippet.tags ? snippet.tags.map(t => `<span class="tag">${t}</span>`).join('') : '';
                container.innerHTML += `
                    <div class="snippet-card">
                        <div class="snippet-header" onclick="toggleSnippet('${snippet.id}')">
                            <div class="snippet-title-group">
                                <svg id="chevron-${snippet.id}" class="chevron" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M13.1716 12.0007L8.22192 7.05093L9.63614 5.63672L16.0001 12.0007L9.63614 18.3646L8.22192 16.9504L13.1716 12.0007Z"></path></svg>
                                <div class="snippet-title">${snippet.name}</div>
                            </div>
                            <div class="snippet-actions" onclick="event.stopPropagation()">
                                <button onclick="openEditModal('${snippet.id}')" title="编辑">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16.757 3l-2 2H5v14h14V9.243l2-2V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h12.757zm3.728-.9l1.414 1.414-9.9 9.9-1.414-1.414 9.9-9.9z"></path></svg>
                                </button>
                                <button onclick="deleteSnippet('${snippet.id}')" title="删除">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M17 6h5v2h-2v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8H2V6h5V3a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v3zm1 2H6v12h12V8zm-9 3h2v6H9v-6zm4 0h2v6h-2v-6zM9 4v2h6V4H9z"></path></svg>
                                </button>
                            </div>
                        </div>
                        <div class="snippet-body" id="body-${snippet.id}">
                            <div class="tags-container" style="margin-bottom: 15px;">${snippetTags}</div>
                            <div class="snippet-content-wrapper">
                                <button class="btn-copy" onclick="copyCode(this, \`${snippet.code.replace(/`/g, '\\`')}\`)" title="一键复制">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 4V2h14v14h-2V4H7zM3 6h14v14H3V6zm2 2v10h10V8H5z"></path></svg>
                                </button>
                                <div class="snippet-content">${highlightCommentsAndHTML(snippet.code)}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderManageTags() {
            const container = document.getElementById('manageTagsContainer');
            container.innerHTML = '';
            state.tags.forEach(tag => {
                container.innerHTML += `
                    <div class="tag" onclick="deleteTag('${tag}')" title="点击删除">
                        ${tag}
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 10.586l4.95-4.95 1.414 1.414-4.95 4.95 4.95 4.95-1.414 1.414-4.95-4.95-4.95 4.95-1.414-1.414 4.95-4.95-4.95-4.95L7.05 5.636z"></path></svg>
                    </div>
                `;
            });
        }

        function renderEditTags() {
            const container = document.getElementById('editTagsGroup');
            container.innerHTML = '';
            state.tags.forEach(tag => {
                container.innerHTML += `
                    <label class="tag-toggle">
                        <input type="checkbox" value="${tag}" class="tag-checkbox">
                        <span class="tag-text">${tag}</span>
                    </label>
                `;
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            renderSnippets();
        });

        function filterByTag(tag) {
            state.activeTag = tag;
            renderSnippets();
            renderFilterTags();
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            if(id === 'editModal') {
                document.getElementById('editId').value = '';
                document.getElementById('editName').value = '';
                document.getElementById('editCode').value = '';
                document.querySelectorAll('.tag-checkbox').forEach(cb => cb.checked = false);
            }
        }

        function openEditModal(id) {
            document.getElementById('modalTitle').innerText = '编辑 CSS';
            const snippet = state.snippets.find(s => s.id === id);
            if (snippet) {
                document.getElementById('editId').value = snippet.id;
                document.getElementById('editName').value = snippet.name;
                document.getElementById('editCode').value = snippet.code;
                document.querySelectorAll('.tag-checkbox').forEach(cb => {
                    cb.checked = snippet.tags && snippet.tags.includes(cb.value);
                });
            }
            openModal('editModal');
        }

        function saveSnippet() {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('editName').value.trim();
            const code = document.getElementById('editCode').value.trim();
            if (!name || !code) return alert('名称和代码不能为空');

            const selectedTags = Array.from(document.querySelectorAll('.tag-checkbox:checked')).map(cb => cb.value);

            if (id) {
                const index = state.snippets.findIndex(s => s.id === id);
                if (index > -1) state.snippets[index] = { id, name, code, tags: selectedTags };
            } else {
                state.snippets.unshift({ id: Date.now().toString(), name, code, tags: selectedTags });
            }

            saveData();
            closeModal('editModal');
        }

        function deleteSnippet(id) {
            if (confirm('确定要删除此 CSS 吗？')) {
                state.snippets = state.snippets.filter(s => s.id !== id);
                saveData();
            }
        }

        function addTag() {
            const input = document.getElementById('newTagName');
            const val = input.value.trim();
            if (val && !state.tags.includes(val)) {
                state.tags.push(val);
                saveData();
                input.value = '';
            }
        }

        function deleteTag(tag) {
            if (confirm(`确定删除标签 "${tag}" 吗？这会从所有关联的 CSS 中移除该标签。`)) {
                state.tags = state.tags.filter(t => t !== tag);
                state.snippets.forEach(s => { if (s.tags) s.tags = s.tags.filter(t => t !== tag); });
                if(state.activeTag === tag) state.activeTag = null;
                saveData();
            }
        }

        function copyCode(btn, code) {
            navigator.clipboard.writeText(code).then(() => {
                const originalSvg = btn.innerHTML;
                btn.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M10 15.172l9.192-9.193 1.415 1.414L10 18l-6.364-6.364 1.414-1.414z"></path></svg>`;
                setTimeout(() => btn.innerHTML = originalSvg, 1500);
            });
        }

        function exportData() {
            const dataStr = JSON.stringify({ tags: state.tags, snippets: state.snippets }, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `css-mgr-backup-${new Date().getTime()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.snippets && Array.isArray(parsed.snippets)) {
                        state.tags = parsed.tags || [];
                        state.snippets = parsed.snippets;
                        saveData();
                        alert('数据导入成功！');
                    } else alert('文件格式错误！');
                } catch (err) { alert('文件解析失败！'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])
            );
        }

        loadData();
    </script>
</body>
</html>
